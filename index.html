<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>GASCRAFT</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      overflow: hidden;
      font-family: 'Courier New', monospace;
    }
    #game-container {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <a href="https://github.com/dnewcome/gascraft" target="_blank" rel="noopener"
     style="position:fixed;bottom:8px;left:10px;font-family:'Courier New',monospace;
            font-size:11px;color:#224422;text-decoration:none;z-index:100;
            transition:color 0.15s"
     onmouseover="this.style.color='#44ff88'" onmouseout="this.style.color='#224422'">
    github.com/dnewcome/gascraft
  </a>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
